[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crystallume"
dynamic = ["version"]
description = "Visualise and manage atoms, clusters and crystals in the browser — local app or multi-user server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Crystallume developers" }]
keywords = ["chemistry", "materials", "crystal", "visualization", "molecules", "cif", "poscar", "xyz"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
# Runtime dependencies are intentionally minimal.
dependencies = [
    "fastapi>=0.110.1",   # 0.110.0 pins Starlette 0.36, whose TestClient fails on httpx>=0.28
    "uvicorn>=0.31",   # CIDR networks in --forwarded-allow-ips
    "numpy>=1.24",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Starlette >= 1.2 runs its TestClient on httpx2 and deprecates plain httpx; older Starlette,
# still allowed by the fastapi range above, only knows httpx. Both are listed so either works.
test = ["pytest>=7", "httpx>=0.27", "httpx2>=2.0"]

[project.scripts]
crystallume = "crystallume.cli:main"

# Plugins: third-party packages register themselves under the entry-point group
# "crystallume.plugins", pointing at a module that defines `register(ctx)`:
#
#   [project.entry-points."crystallume.plugins"]
#   myplugin = "my_package.crystallume_plugin"
#
# Crystallume itself ships no entry-point plugins.

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "crystallume._version.__version__" }

[tool.setuptools.packages.find]
# atomscope: the package's former name, a thin alias of crystallume for code written before the rename
include = ["crystallume*", "atomscope"]
namespaces = false

[tool.setuptools.package-data]
crystallume = ["web/**/*", "data/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = [
    "js: needs Node.js >= 22 (skipped when it is missing; CRYSTALLUME_REQUIRE_NODE=1 makes that a failure)",
    "slow: end-to-end browser tests (run with: pytest -m slow)",
]
filterwarnings = [
    "ignore::DeprecationWarning:anyio.*",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:httpx.*",
]
