# docker compose up -d
# docker compose exec atomscope atomscope user create alice
services:
  atomscope:
    build: .
    image: atomscope:0.1.0
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      ATOMSCOPE_MODE: cloud                 # or "local" for a single-user server
      ATOMSCOPE_ALLOW_REGISTRATION: "true"  # set to "false" and create accounts with `atomscope user create`
      # ATOMSCOPE_SECRET: change-me         # optional; otherwise generated into /data/secret.key
      # ATOMSCOPE_CORS_ORIGINS: https://viewer.example.org
      ATOMSCOPE_MAX_PROJECT_MB: "50"
    volumes:
      - atomscope-data:/data
      - ./examples/plugins:/plugins:ro      # plugin directory (ATOMSCOPE_PLUGIN_DIRS=/plugins)

volumes:
  atomscope-data:
